name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------- Stage 1: Continuous Integration ----------------
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/requirements.txt -r ${{ matrix.service }}/requirements-dev.txt
      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: pytest -v

  # ---------------- Stage 2: Build & push Docker images ----------------
  build:
    name: Build ${{ matrix.service }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-service, order-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Registry owner must be lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/microshop-${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER }}/microshop-${{ matrix.service }}:${{ github.sha }}

  # ---------------- Stage 3: Continuous Deployment to EC2 ----------------
  deploy:
    name: Deploy to AWS EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registry owner must be lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: microshop

      - name: Pull new images and restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/microshop
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export OWNER=${{ env.OWNER }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export SNS_TOPIC_ARN=${{ secrets.SNS_TOPIC_ARN }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps

      - name: Smoke test the live site (app + DynamoDB)
        run: |
          URL="http://${{ secrets.EC2_HOST }}"
          for i in $(seq 1 12); do
            if curl -fsS "$URL/api/product-service/health" && curl -fsS "$URL/api/product-service/products" > /dev/null; then
              echo; echo "Deployment healthy: services up and DynamoDB reachable"; exit 0
            fi
            echo "Waiting for app... ($i)"; sleep 5
          done
          echo "App did not become healthy"; exit 1

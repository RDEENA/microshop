# Nginx serves the UI and acts as an API gateway / reverse proxy
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/product-service/ {
        proxy_pass http://product-service:5001/;
    }

    location /api/order-service/ {
        proxy_pass http://order-service:5002/;
    }
}
